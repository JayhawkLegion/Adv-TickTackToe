<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Settings - Tic-Tac-Toe</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1f29">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tic-Tac-Toe">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Settings</h1>

    <div class="setting-block">
      <label for="sizeCount">Number of circle sizes: <strong id="sizeCountValue">1</strong></label>
      <input type="range" id="sizeCount" min="1" max="6" step="1" value="1">
      <div id="preview" class="preview-stack-wrap" aria-hidden="true"></div>
      <p class="settings-hint" id="hintText">
        1 = classic X and O.
      </p>
    </div>

    <div class="settings-actions">
      <button id="saveBtn" class="reset-btn">Save &amp; Back to Game</button>
    </div>
  </main>

  <script src="pieces.js"></script>
  <script src="settings.js"></script>
</body>
</html>
