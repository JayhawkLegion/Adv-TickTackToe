<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tic-Tac-Toe</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1f29">

<!-- iOS standalone app support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tic-Tac-Toe">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="installBanner" class="install-banner" hidden>
    Add this app to your Home Screen: tap
    <svg viewBox="0 0 24 24" class="share-icon" aria-hidden="true"><path fill="currentColor" d="M12 2l4.5 4.5-1.4 1.4L13 5.8V15h-2V5.8L8.9 7.9 7.5 6.5 12 2zM6 20h12a1 1 0 0 0 1-1v-8h2v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3v-8h2v8a1 1 0 0 0 1 1z"/></svg>
    then "Add to Home Screen".
    <button id="dismissBanner" class="dismiss-banner" aria-label="Dismiss">&times;</button>
  </div>

  <main class="game">
    <div class="title-row">
      <h1>Tic-Tac-Toe</h1>
      <a href="settings.html" class="settings-link" aria-label="Settings">
        <svg viewBox="0 0 24 24" class="gear-icon" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.14 7.14 0 0 0-.06.94c0 .32.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.49.39 1.03.7 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      </a>
    </div>

    <p id="status" class="status" aria-live="polite">Player X's turn</p>

    <div id="board" class="board" role="grid" aria-label="Tic-tac-toe board">
      <button class="cell" data-index="0" role="gridcell" aria-label="Row 1, Column 1"></button>
      <button class="cell" data-index="1" role="gridcell" aria-label="Row 1, Column 2"></button>
      <button class="cell" data-index="2" role="gridcell" aria-label="Row 1, Column 3"></button>
      <button class="cell" data-index="3" role="gridcell" aria-label="Row 2, Column 1"></button>
      <button class="cell" data-index="4" role="gridcell" aria-label="Row 2, Column 2"></button>
      <button class="cell" data-index="5" role="gridcell" aria-label="Row 2, Column 3"></button>
      <button class="cell" data-index="6" role="gridcell" aria-label="Row 3, Column 1"></button>
      <button class="cell" data-index="7" role="gridcell" aria-label="Row 3, Column 2"></button>
      <button class="cell" data-index="8" role="gridcell" aria-label="Row 3, Column 3"></button>
    </div>

    <div id="trays" class="trays" hidden>
      <div class="tray" id="trayR" data-color="R">
        <span class="tray-label">Red</span>
        <div class="tray-slots" id="traySlotsR"></div>
      </div>
      <div class="tray" id="trayB" data-color="B">
        <span class="tray-label">Blue</span>
        <div class="tray-slots" id="traySlotsB"></div>
      </div>
    </div>

    <div class="scoreboard">
      <div class="score"><span id="scoreLabel1">X wins</span><strong id="scoreX">0</strong></div>
      <div class="score"><span>Draws</span><strong id="scoreDraw">0</strong></div>
      <div class="score"><span id="scoreLabel2">O wins</span><strong id="scoreO">0</strong></div>
    </div>

    <button id="resetBtn" class="reset-btn">New Game</button>
  </main>

  <script src="pieces.js"></script>
  <script src="script.js"></script>
</body>
</html>
