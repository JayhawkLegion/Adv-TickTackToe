<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Connect 4</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1f29">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Connect 4">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game c4-page">
    <div class="title-row">
      <div class="menu-wrap">
        <button id="menuBtn" class="menu-btn" aria-label="Menu" aria-expanded="false" aria-haspopup="true">
          <svg viewBox="0 0 24 24" class="menu-icon" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
        </button>
        <div id="menuDropdown" class="menu-dropdown" hidden>
          <a href="index.html" class="menu-item" data-page="index.html">Tic-Tac-Toe</a>
          <a href="fence.html" class="menu-item" data-page="fence.html">Fence</a>
          <a href="connect4.html" class="menu-item" data-page="connect4.html">Connect 4</a>
        </div>
      </div>

      <h1>Connect 4</h1>
      <a href="connect4-settings.html" class="settings-link" aria-label="Settings">
        <svg viewBox="0 0 24 24" class="gear-icon" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.14 7.14 0 0 0-.06.94c0 .32.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.49.39 1.03.7 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      </a>
    </div>

    <p id="status" class="status" aria-live="polite">Red's turn</p>

    <div id="c4Board" class="c4-board" role="grid" aria-label="Connect 4 board"></div>

    <div class="scoreboard">
      <div class="score"><span class="c4-red-label">Red wins</span><strong id="scoreRed">0</strong></div>
      <div class="score"><span>Draws</span><strong id="scoreDraw">0</strong></div>
      <div class="score"><span class="c4-yellow-label">Yellow wins</span><strong id="scoreYellow">0</strong></div>
    </div>

    <button id="resetBtn" class="reset-btn">New Game</button>
  </main>

  <script src="menu.js"></script>
  <script src="connect4.js"></script>
</body>
</html>
