<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Collection - Card Clash</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1f29">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Card Clash">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game cc-page">
    <h1 id="collectionTitle">Collection</h1>
    <p id="collectionSummary" class="status"></p>

    <div id="noPlayer" hidden>
      <p class="cc-note">No player yet. Start Card Clash to create one and get your starter cards.</p>
    </div>

    <div id="playerInfo" hidden>
      <h2 class="cc-heading">Stats</h2>
      <div id="statsGrid" class="cc-stats"></div>

      <div class="cc-heading-row">
        <h2 class="cc-heading">Cards</h2>
        <label class="cc-toggle"><input id="showMissing" type="checkbox"> Show cards not found yet</label>
      </div>
      <div id="groupBy" class="size-options cc-group-by" role="group" aria-label="Group cards by">
        <button type="button" class="size-option selected" data-group="set" aria-pressed="true">Sets</button>
        <button type="button" class="size-option" data-group="rarity" aria-pressed="false">Rarity</button>
      </div>
      <div id="rarityFilter" class="size-options cc-filter" role="group" aria-label="Show cards of rarity"></div>
      <div id="collectionGroups"></div>

      <p class="settings-hint cc-tap-hint">Tap a card for a close-up.</p>

      <h2 class="cc-heading">Recent games</h2>
      <ul id="historyList" class="cc-history"></ul>
    </div>

    <div class="settings-actions">
      <a href="cards.html" class="reset-btn cc-btn-link">Back to Game</a>
    </div>
  </main>

  <!-- Close-up of one card -->
  <dialog id="cardDialog" class="cc-dialog" aria-labelledby="closeupTitle">
    <div class="cc-closeup">
      <div id="closeupCard" class="cc-closeup-card"></div>
      <h2 id="closeupTitle" class="cc-closeup-title"></h2>
      <p id="closeupMeta" class="cc-closeup-meta"></p>
      <dl id="closeupStats" class="cc-closeup-stats"></dl>
      <p id="closeupNote" class="settings-hint"></p>
      <button id="closeupClose" type="button" class="reset-btn">Close</button>
    </div>
  </dialog>

  <script src="cards-pool.js"></script>
  <script src="cards-rules.js"></script>
  <script src="cards-data.js"></script>
  <script src="cards-cloud-config.js"></script>
  <script src="cards-online.js"></script>
  <script src="cards-store.js"></script>
  <script src="cards-collection.js"></script>
</body>
</html>
